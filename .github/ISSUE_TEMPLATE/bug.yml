name: Bug report
description: Something in an SDK, the MCP proxy or the docs is broken
labels: [bug]
body:
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      options: [Python SDK, TypeScript SDK, MCP proxy, Hosted MCP server, REST API, Docs / integrations]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the request (without your API key!), the response and the version.
    validations:
      required: true
